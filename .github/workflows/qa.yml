name: Full QA
on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEBUG: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
      QA_PYTHON: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-qa.lock
          python -m pip install --no-deps -e .
          npm ci --prefix frontend
          python scripts/install_qa_tools.py
      - name: Lint and validate workflows
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
          npm --prefix frontend run lint
          /tmp/indra-qa-bin/actionlint
      - name: Unit gate
        run: |
          python scripts/qa.py unit
          npm --prefix frontend run test:coverage
      - name: Integration gate
        run: python scripts/qa.py integration
      - name: Build frontend and Docker QA images
        run: |
          npm --prefix frontend run build
          docker compose -f compose.qa.yml config --quiet
          docker compose -f compose.qa.yml build backend frontend
      - name: Browser gate
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Security and reliability gates
        run: |
          python scripts/qa.py security
          python scripts/qa.py performance
          python scripts/qa_security.py
      - name: Coverage gate
        run: python scripts/qa.py gate
      - name: Generate evidence reports
        if: always()
        run: python scripts/qa_reports.py
      - name: Verify preservation and evidence
        run: python scripts/qa_verify.py
      - name: Publish execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-evidence
          path: |
            design/qa/evidence/
            design/qa/CODE_COVERAGE.md
            design/qa/FINAL_TEST_REPORT.md
          retention-days: 14
          if-no-files-found: warn
