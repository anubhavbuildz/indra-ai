services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.qa
      target: backend
    environment:
      QA_BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
    volumes:
      - ./design/qa/evidence:/workspace/design/qa/evidence
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.qa
      target: frontend
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
    volumes:
      - ./design/qa/evidence:/workspace/design/qa/evidence
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 3s
      timeout: 4s
      retries: 20
  e2e:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: Dockerfile.qa
      target: browser
    environment:
      QA_EXTERNAL_SERVERS: "1"
      QA_FRONTEND_URL: http://frontend:5173
      QA_BACKEND_URL: http://backend:8000
    depends_on:
      frontend: {condition: service_healthy}
    volumes:
      - ./design/qa/evidence:/workspace/design/qa/evidence
