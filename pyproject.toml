[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indra-backend"
version = "0.1.0"
description = "Backend for the Indra AWS security assessment assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.40,<4",
    "PyJWT>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sentence-transformers>=3.0,<6",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.llm" = ["roles/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
